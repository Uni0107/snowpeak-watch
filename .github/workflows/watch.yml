name: snowpeak-watch

# GitHub の定期実行（schedule）は数時間に1回しか動かないことがあるため、
# 1回の実行の中で約5時間半、10分ごとに確認を繰り返し、終わる直前に次の実行を自分で起動する。
# schedule は、この連鎖が何かの理由で途切れたときの再開用。
on:
  schedule:
    - cron: "17 * * * *"
  workflow_dispatch:  # 手動実行ボタン

concurrency:
  group: snowpeak-watch
  cancel-in-progress: false

permissions:
  contents: read
  actions: write  # 次の実行を起動するため

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 360
    env:
      TZ: Asia/Tokyo
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
          cache: pip
      - run: pip install -r requirements.txt
      - run: playwright install --with-deps chromium-headless-shell
      # 前回の空き状態（state.json）を次回の実行へ引き継ぐ
      - uses: actions/cache/restore@v4
        with:
          path: state.json
          key: state-${{ github.run_id }}
          restore-keys: state-
      - run: python check.py --loop 330
        env:
          NTFY_TOPIC: ${{ secrets.NTFY_TOPIC }}
      - uses: actions/cache/save@v4
        if: always()
        with:
          path: state.json
          key: state-${{ github.run_id }}
      - name: 次の実行を起動
        if: always()
        run: gh workflow run snowpeak-watch --ref main
        env:
          GH_TOKEN: ${{ github.token }}
